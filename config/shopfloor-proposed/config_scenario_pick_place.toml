# Scenario: every pick is followed by a place within 60 s
#
# A pick starts a timer for that MM, and its next place stops it. If 60 s pass without a place, the part may have been
# dropped or the MM is stuck: one alert.
#
# A reduce per MM remembers whether it holds a part, and since when (the simulator's ts). It only notices time passing
# when a message arrives, so it also reads the MM's own telemetry: its sensors report every 0.5 s. An MM that went
# completely silent wouldn't be noticed; a watchdog on its telemetry would catch that.
#
# Demo: 15 s instead of 60 s (replace 15000.0 by 60000.0 in the expressions).
#
# Reads the MQTT topics factory/mm/mm1 and factory/mm/mm2 (everything about each MM), with the wildcard factory/mm/+.
#
#   broker:         docker run -it -p 1883:1883 eclipse-mosquitto
#   shopfloor-sim:  cargo run --bin shopfloor -- run scenarios/proposed-liminal-scenarios.toml --scene shift   (or lost_part)
#   Liminal:        cargo run -- --config config/shopfloor-proposed/config_scenario_pick_place.toml

[inputs.mms]
type = "mqtt_sub"
output = "mm_events"
channel = { type = "broadcast", capacity = 1024 }
parameters = { broker_url = "mqtt://127.0.0.1:1883", topics = ["factory/mm/+"] }

[inputs.mms.timing]
event_time_field = "ts"

[pipelines.pick_place]
description = "A pick not followed by a place within 15 s"

# Per MM: whether it holds a part, since when (picked_at) and for how long (held_s), and whether it's overdue (over
# 15 s). `alert` is true only on the first overdue message, so each late part gives one alert.
[pipelines.pick_place.stages.holding]
type = "reduce"
inputs = ["mm_events"]
output = "mm_holding"

[pipelines.pick_place.stages.holding.parameters]
group_by = ["entity"]
initial = { holding = false, picked_at = 0.0, held_s = 0.0, overdue = false, alert = false }
update = [
  { field = "holding", expression = "true", when = { field_path = "action", operation = "equals", value = "pick" } },
  { field = "holding", expression = "false", when = { field_path = "action", operation = "equals", value = "place" } },
  { field = "picked_at", expression = "ts", when = { field_path = "action", operation = "equals", value = "pick" } },
  { field = "held_s", expression = "if(state.holding, (ts - state.picked_at) / 1000.0, 0.0)" },
  { field = "overdue", expression = "state.holding && ts - state.picked_at > 15000.0" },
  { field = "alert", expression = "!state.overdue && state.holding && ts - state.picked_at > 15000.0" },
]

# Only the alerts.
[pipelines.pick_place.stages.alerts]
type = "rule"
inputs = ["mm_holding"]
output = "pick_place_alerts"

[[pipelines.pick_place.stages.alerts.parameters.rules]]
condition = { field_path = "alert", operation = "equals", value = true }
actions = [{ type = "pass_through" }]
else_actions = [{ type = "drop_message" }]

[outputs.console]
type = "console"
inputs = ["pick_place_alerts"]
