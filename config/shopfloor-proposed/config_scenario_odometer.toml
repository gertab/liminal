# Scenario: odometer per MM, with a service due every 1 km
#
# A reduce per MM keeps the distance it has driven, adding the distance from its previous position at each new
# position. When the total passes a multiple of the service interval, a service is due: an alert, once per interval.
# The running distance is on the stage's output channel (mm_distance) for a dashboard.
#
# Demo scale: a service every 10 m instead of every 1 km (replace 10.0 by 1000.0 in the expressions). In the
# 2-minute shift scene, mm1 drives about 51 m and mm2 about 22 m.
#
# Events: the simulator's MQTT topic factory/positions (the MMs' positions).
#
#   broker:         docker run -it -p 1883:1883 eclipse-mosquitto   (an MQTT broker on 127.0.0.1:1883)
#   shopfloor-sim:  cargo run --bin shopfloor -- run scenarios/proposed-liminal-scenarios.toml --scene shift   (or production)
#   Liminal:        cargo run -- --config config/shopfloor-proposed/config_scenario_odometer.toml

[inputs.positions]
type = "mqtt_sub"
output = "positions"
channel = { type = "broadcast", capacity = 1024 }
parameters = { broker_url = "mqtt://127.0.0.1:1883", topics = ["factory/positions"] }

[inputs.positions.timing]
event_time_field = "timestamp_ms"

[pipelines.odometer]
description = "Distance driven per MM, and services due"

# prev is the MM's previous position (the position itself the first time, so it adds 0).
[pipelines.odometer.stages.distance]
type = "reduce"
inputs = ["positions"]
output = "mm_distance"

[pipelines.odometer.stages.distance.parameters]
group_by = ["device_id"]
initial = { distance_m = 0.0, service_due = false }
update = [
  { field = "distance_m", expression = "state.distance_m + math::hypot(x - prev.x, y - prev.y)" },
  { field = "service_due", expression = "floor((state.distance_m + math::hypot(x - prev.x, y - prev.y)) / 10.0) > floor(state.distance_m / 10.0)" },
]
# service_due is true when the distance crosses a multiple of 10m

[pipelines.odometer.stages.services]
type = "rule"
inputs = ["mm_distance"]
output = "services_due"

[[pipelines.odometer.stages.services.parameters.rules]]
condition = { field_path = "service_due", operation = "equals", value = true }
actions = [{ type = "pass_through" }]
else_actions = [{ type = "drop_message" }]

[outputs.console]
type = "console"
inputs = ["services_due", "mm_distance"]
