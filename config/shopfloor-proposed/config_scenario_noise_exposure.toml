# Scenario: daily noise exposure, so far and projected to the end of the shift
#
# Directive 2003/10/EC sets its levels on the daily exposure LEX,8h, the energy average of the noise over an 8-hour
# day. At 80 dB(A) hearing protection must be made available, at 85 dB(A) it must be worn, and 87 dB(A) is the limit
# (https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32003L0010).
#
# An energy average is not the average of the dB values: each reading becomes 10^(L/10), those are averaged, and
# 10·log10 turns the result back into dB. Every 10 s a window averages the energy (and, for comparison, the dB
# values), and a reduce adds the period to the exposure so far. It then reports:
#   - laeq_so_far: the level so far;
#   - dose_pct: the dose so far, as a share of 85 dB(A) over the whole shift;
#   - projected_lex: the day's exposure if the last period's level held to the end of the shift;
#   - action: the directive's action level the projection reaches.
#
# Demo time scale: the shift is 2 minutes (120 s) instead of 8 hours, and a report comes every 10 s (40 min of a real
# shift). For a real shift, set size_ms = 1800000 (30 min) and replace 120.0 by 28800.0 in the expressions.
#
# Events: the simulator's MQTT topic factory/sensors/noise (noise readings only).
#
#   broker:         docker run -it -p 1883:1883 eclipse-mosquitto   (an MQTT broker on 127.0.0.1:1883)
#   shopfloor-sim:  cargo run --bin shopfloor -- run scenarios/proposed-liminal-scenarios.toml --scene shift   (or noisy_period)
#   Liminal:        cargo run -- --config config/shopfloor-proposed/config_scenario_noise_exposure.toml   (start it first)

[inputs.noise]
type = "mqtt_sub"
output = "noise_readings"
channel = { type = "broadcast", capacity = 1024 }
parameters = { broker_url = "mqtt://127.0.0.1:1883", topics = ["factory/sensors/noise"] }

[inputs.noise.timing]
event_time_field = "ts"

[pipelines.noise]
description = "Noise exposure over the shift"

# Each noise reading's sound energy.
[pipelines.noise.stages.energy]
type = "rule"
inputs = ["noise_readings"]
output = "noise_energy"

[[pipelines.noise.stages.energy.parameters.rules]]
condition = { operation = "always" }
actions = [{ type = "compute_field", field_path = "energy", expression = "math::pow(10.0, value / 10.0)" }]

# Every 10 s: the period's average energy, and the plain average of the dB values for comparison.
[pipelines.noise.stages.period]
type = "window"
inputs = ["noise_energy"]
output = "noise_periods"

[pipelines.noise.stages.period.parameters]
kind = "tumbling"
size_ms = 10000
aggregates = [
  { function = "avg", field = "energy", as = "energy_avg" },
  { function = "avg", field = "value", as = "db_mean" },
  { function = "count", as = "readings" },
]

# The period's equivalent level, and its length in seconds.
[pipelines.noise.stages.period_level]
type = "rule"
inputs = ["noise_periods"]
output = "noise_period_levels"

[[pipelines.noise.stages.period_level.parameters.rules]]
condition = { operation = "always" }
actions = [
  { type = "compute_field", field_path = "laeq", expression = "10.0 * log(energy_avg)" },
  { type = "compute_field", field_path = "period_s", expression = "(window_end - window_start) / 1000.0" },
]

# The shift so far: exposure (energy × seconds) and elapsed time, then the level, dose and projection.
[pipelines.noise.stages.shift]
type = "reduce"
inputs = ["noise_period_levels"]
output = "noise_exposure"

[pipelines.noise.stages.shift.parameters]
include_message = true
initial = { exposure = 0.0, elapsed_s = 0.0, laeq_so_far = 0.0, dose_pct = 0.0, projected_lex = 0.0 }
update = [
  { field = "exposure", expression = "state.exposure + energy_avg * period_s" },
  { field = "elapsed_s", expression = "state.elapsed_s + period_s" },
  { field = "laeq_so_far", expression = "10.0 * log((state.exposure + energy_avg * period_s) / (state.elapsed_s + period_s))" },
  { field = "dose_pct", expression = "100.0 * (state.exposure + energy_avg * period_s) / (120.0 * math::pow(10.0, 8.5))" },
  { field = "projected_lex", expression = "10.0 * log((state.exposure + energy_avg * period_s + energy_avg * max(120.0 - state.elapsed_s - period_s, 0.0)) / 120.0)" },
]

# The directive's action level the projection reaches.
[pipelines.noise.stages.action_level]
type = "rule"
inputs = ["noise_exposure"]
output = "noise_report"

[[pipelines.noise.stages.action_level.parameters.rules]]
condition = { operation = "always" }
actions = [
  { type = "set_field", field_path = "action", value = "none" },
  { type = "remove_field", field_path = "energy_avg" },
  { type = "remove_field", field_path = "exposure" },
]

[[pipelines.noise.stages.action_level.parameters.rules]]
condition = { field_path = "projected_lex", operation = ">=", value = 80.0 }
actions = [{ type = "set_field", field_path = "action", value = "80 dB(A): make hearing protection available" }]

[[pipelines.noise.stages.action_level.parameters.rules]]
condition = { field_path = "projected_lex", operation = ">=", value = 85.0 }
actions = [{ type = "set_field", field_path = "action", value = "85 dB(A): hearing protection must be worn" }]

[[pipelines.noise.stages.action_level.parameters.rules]]
condition = { field_path = "projected_lex", operation = ">=", value = 87.0 }
actions = [{ type = "set_field", field_path = "action", value = "87 dB(A): over the exposure limit" }]

[outputs.console]
type = "console"
inputs = ["noise_report"]
