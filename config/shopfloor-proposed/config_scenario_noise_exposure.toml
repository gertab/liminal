# Scenario: daily noise exposure, so far and projected to the end of the shift
#
# The EU noise directive measures the daily exposure LEX,8h: the average noise energy over an 8-hour day.
# At 80 dB(A) hearing protection must be available, at 85 dB(A) it must be worn, and 87 dB(A) is the limit.
#
# Decibels are logarithmic, so you average the sound energy, then convert back to decibels.
#
# A tumbling window as long as the shift holds its readings, as energy, 10^(L/10). With every reading it outputs the
# shift so far, and a rule reports:
#   - level: the latest reading;
#   - elapsed_s: the time into the shift;
#   - dose_pct: the dose so far (100% = 85 dB(A) for the whole shift);
#   - projected_lex: the day's exposure if the latest level continues;
#   - action: the action level the projection reaches.
#
# Each reading counts for 1 s, as the sensor reports every second. Shifts follow the clock: a tumbling window starts
# at a multiple of its length (8-hour shifts at 00:00, 08:00 and 16:00 UTC), so in the demo the first shift is usually
# cut short. A version with a reduce, which counts the shift from when Liminal starts, is commented at the end.
#
# why compute by energy? For instance, half an hour at 80 dB(A) plus half an hour at 90 dB(A) gives an LAeq of about 87.4 dB(A), not 85, because 90 dB carries ten times the energy of 80.
#
# Demo: a 2-minute shift instead of 8 hours. For a real shift, set size_ms = 28800000 and replace 120.0 by 28800.0.
#
# Reads the MQTT topic factory/sensors/noise.
#
#   broker:         docker run -it -p 1883:1883 eclipse-mosquitto
#   shopfloor-sim:  cargo run --bin shopfloor -- run scenarios/proposed-liminal-scenarios.toml --scene shift   (or noisy_period)
#   Liminal:        cargo run -- --config config/shopfloor-proposed/config_scenario_noise_exposure.toml   (start it first)

[inputs.noise]
type = "mqtt_sub"
output = "noise_readings"
channel = { type = "broadcast", capacity = 1024 }
parameters = { broker_url = "mqtt://127.0.0.1:1883", topics = ["factory/sensors/noise"] }

[inputs.noise.timing]
event_time_field = "ts"

[pipelines.noise]
description = "Noise exposure over the shift"

# Each noise reading's sound energy.
[pipelines.noise.stages.energy]
type = "rule"
inputs = ["noise_readings"]
output = "noise_energy"

[[pipelines.noise.stages.energy.parameters.rules]]
condition = { operation = "always" }
actions = [{ type = "compute_field", field_path = "energy", expression = "math::pow(10.0, value / 10.0)" }]

# The shift so far, with every reading: a window as long as the shift.
[pipelines.noise.stages.shift]
type = "window"
inputs = ["noise_energy"]
output = "noise_shift"

[pipelines.noise.stages.shift.parameters]
kind = "tumbling"
size_ms = 120000
emit = "every_message"
aggregates = [
  { function = "sum", field = "energy", as = "energy_sum" },
  { function = "last", field = "value", as = "level" },
  { function = "last", field = "ts", as = "ts_now" },
]

# The time into the shift, the dose, the projection and the directive's action level. With each reading counting for
# 1 s, energy_sum is the exposure so far (energy × seconds).
[pipelines.noise.stages.report]
type = "rule"
inputs = ["noise_shift"]
output = "noise_report"

[[pipelines.noise.stages.report.parameters.rules]]
condition = { operation = "always" }
actions = [{ type = "compute_field", field_path = "elapsed_s", expression = "(ts_now - window_start) / 1000.0" }]

[[pipelines.noise.stages.report.parameters.rules]]
condition = { operation = "always" }
actions = [
  # dose_pct = 100 × energy received so far / energy allowed for the whole shift
  { type = "compute_field", field_path = "dose_pct", expression = "100.0 * energy_sum / (120.0 * math::pow(10.0, 85 / 10.0))" },
  { type = "compute_field", field_path = "projected_lex", expression = "10.0 * log((energy_sum + math::pow(10.0, level / 10.0) * max(120.0 - elapsed_s, 0.0)) / 120.0)" },
  { type = "set_field", field_path = "action", value = "none" },
  { type = "remove_field", field_path = "energy_sum" },
  { type = "remove_field", field_path = "ts_now" },
]

[[pipelines.noise.stages.report.parameters.rules]]
condition = { field_path = "projected_lex", operation = ">=", value = 80.0 }
actions = [{ type = "set_field", field_path = "action", value = "80 dB(A): make hearing protection available" }]

[[pipelines.noise.stages.report.parameters.rules]]
condition = { field_path = "projected_lex", operation = ">=", value = 85.0 }
actions = [{ type = "set_field", field_path = "action", value = "85 dB(A): hearing protection must be worn" }]

[[pipelines.noise.stages.report.parameters.rules]]
condition = { field_path = "projected_lex", operation = ">=", value = 87.0 }
actions = [{ type = "set_field", field_path = "action", value = "87 dB(A): over the exposure limit" }]

[outputs.console]
type = "console"
inputs = ["noise_report"]

# --- Alternative: the same with a reduce -----------------------------------------------------------------------------
