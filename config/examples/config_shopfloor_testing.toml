
[pipelines.shopfloor]
description = "Split the shopfloor stream: MM activity, sensor readings, vibration alerts"

[pipelines.shopfloor.stages.only_actions]
type = "rule"
inputs = ["shopfloor_sample_2_out"]
output = "only_actions_data"

[pipelines.shopfloor.stages.only_actions.parameters ]
rules = [
    # Keep actions and move commands
    { condition = { field_path = "kind", operation = "equals", value = "action" }, actions = [{ type = "set_field", field_path = "keep", value = true }] },
    { condition = { field_path = "kind", operation = "equals", value = "move_command" }, actions = [{ type = "set_field", field_path = "keep", value = true }] },
    # ...then drop everything untagged, and remove the tag from the rest.
    { condition = { field_path = "keep", operation = "equals", value = true }, actions = [{ type = "remove_field", field_path = "keep" }], else_actions = [{ type = "drop_message" }] },
]
error_strategy = "continue" 

[outputs.consoleeee]
type = "console"
inputs = ["only_actions_data"]

[outputs.fileee]
type = "file"
inputs = ["only_actions_data"]
parameters = { format = "json", append = true, create_dirs = true, buffer_size = 8192, auto_flush = false , file_path = "aaa.json" }

[inputs]

[inputs.shopfloor_sample_2]
type = "shopfloor"
output = "shopfloor_sample_2_out"
parameters = { scenario = "config/shopfloor/testing-floor.toml", scene = "production", view_interval_ms = 100 }
