# Shopfloor → Liminal over TCP
#
# Consumes the event stream of the shopfloor simulator (shopfloor/README.md). The simulator listens
# on 127.0.0.1:9000 (`[output.sinks.liminal]` in config/shopfloor/sample-floor.toml); this pipeline
# connects to it and reconnects whenever the simulator restarts, so either side can start first.
#
#   cd shopfloor && cargo run -p shopfloor-cli -- run ../config/shopfloor/sample-floor.toml --scene production
#   cargo run -- --config config/examples/config_shopfloor_tcp.toml
#
# (or run the shopfloor app and play a scene there, and run this config from the Liminal GUI).
#
# Every event arrives as one JSON payload with a top-level `kind` (position, move_command, arrived,
# stopped, action, sensor, sensor_set, scene, sim); the stages below route on it.

[inputs.shopfloor]
type = "tcp_input"
output = "shopfloor_events"
channel = { type = "broadcast", capacity = 1024 }
parameters = { mode = "client", host = "127.0.0.1", port = 9000, reconnect = true, reconnect_interval_ms = 1000 }

[pipelines.shopfloor]
description = "Split the shopfloor stream: MM activity, sensor readings, vibration alerts"

# What the mobile manipulators and scenes do: everything except positions and sensor readings.
[pipelines.shopfloor.stages.mm_activity]
type = "rule"
inputs = ["shopfloor_events"]
output = "mm_activity"

[[pipelines.shopfloor.stages.mm_activity.parameters.rules]]
condition = { field_path = "kind", operation = "equals", value = "position" }
actions = [{ type = "drop_message" }]

[[pipelines.shopfloor.stages.mm_activity.parameters.rules]]
condition = { field_path = "kind", operation = "equals", value = "sensor" }
actions = [{ type = "drop_message" }]

[outputs.shopfloor_log]
type = "console"
inputs = ["mm_activity"]
